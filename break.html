<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undaunted | On Break</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Mono:wght@400;500;700&display=swap');

:root {
  --bg: #101411;
  --lime: #d5ff35;
  --white: #f4f5ef;
  --muted: #a1a99e;
  --red: #ff3838;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  color: var(--white);
  background: var(--bg);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  width: 100%;
  min-height: 100%;
}

.screen {
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(14px, 3.5vw, 48px);
  width: 100%;
  max-width: 100vw;
  background:
    radial-gradient(ellipse at 78% 50%, #293527 0%, transparent 55%),
    #101411;
}

.grid {
  position: absolute;
  z-index: -2;
  inset: 0;
  opacity: .24;
  background-image:
    linear-gradient(#ffffff0b 1px, transparent 1px),
    linear-gradient(90deg, #ffffff0b 1px, transparent 1px);
  background-size: 32px 32px;
}

.glow {
  position: absolute;
  z-index: -1;
  width: 65vw;
  height: 65vw;
  max-width: 450px;
  max-height: 450px;
  right: -10%;
  top: 5%;
  border-radius: 50%;
  background: #d5ff3510;
  filter: blur(55px);
  animation: glow 7s ease-in-out infinite alternate;
}

header, footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 3;
  width: 100%;
  min-width: 0;
}

.brand {
  display: flex;
  align-items: center;
  min-width: 0;
}

.brand-logo {
  height: clamp(18px, 4vw, 26px);
  width: auto;
  display: block;
  object-fit: contain;
}

.brand-text {
  font-family: 'Barlow Condensed', Impact, sans-serif;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: .08em;
  color: var(--white);
  display: none;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 10px 'DM Mono', monospace;
  letter-spacing: .08em;
  color: #c5cec2;
  text-align: right;
  flex-shrink: 0;
}

.dot {
  width: 8px;
  height: 8px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 13px #d5ff3580;
  animation: pulse 2s infinite;
}

.dot.overtime-dot {
  background: var(--red);
  box-shadow: 0 0 14px rgba(255, 56, 56, 0.85);
  animation: pulse-danger 1s infinite alternate;
}

main {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  align-items: center;
  flex: 1;
  gap: clamp(16px, 3.5vw, 40px);
  padding: 20px 0;
  width: 100%;
  min-width: 0;
}

.copy {
  position: relative;
  z-index: 2;
  min-width: 0;
  width: 100%;
}

.eyebrow {
  margin: 0 0 10px;
  color: var(--lime);
  font: 10px 'DM Mono', monospace;
  letter-spacing: .2em;
}

h1 {
  margin: 0;
  font-family: 'Barlow Condensed', Impact, sans-serif;
  font-weight: 900;
  font-size: clamp(48px, 10vw, 150px);
  line-height: 0.85;
  letter-spacing: -.04em;
  word-break: break-word;
}

h1 span {
  display: block;
}

h1 .lime {
  margin-top: .05em;
  color: var(--lime);
}

.timer-container {
  margin-top: clamp(14px, 2.5vw, 28px);
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 18px;
  background: rgba(16, 20, 17, 0.78);
  border: 1px solid rgba(213, 255, 53, 0.3);
  border-radius: 12px;
  width: fit-content;
  max-width: 100%;
  min-width: 0;
  backdrop-filter: blur(10px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(213, 255, 53, 0.04);
  transition: all 0.3s ease;
}

.timer-label {
  font: 700 clamp(9px, 2.2vw, 12px) 'DM Mono', monospace;
  letter-spacing: .2em;
  color: var(--lime);
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
}

.timer-value {
  font: 800 clamp(38px, 7.5vw, 80px) 'DM Mono', monospace;
  color: var(--lime);
  letter-spacing: -0.02em;
  line-height: 0.95;
  text-shadow: 0 0 24px rgba(213, 255, 53, 0.3);
}

.timer-container.overtime-active {
  border-color: rgba(255, 56, 56, 0.7);
  background: rgba(35, 10, 10, 0.55);
  box-shadow: 0 12px 40px rgba(255, 56, 56, 0.3), inset 0 0 25px rgba(255, 56, 56, 0.08);
}

.timer-container.overtime-active .timer-label {
  color: var(--red);
}

.timer-container.overtime-active .timer-value {
  color: var(--red);
  text-shadow: 0 0 28px rgba(255, 56, 56, 0.65);
  animation: blink 1.2s infinite ease-in-out;
}

.message {
  margin-top: clamp(14px, 2vw, 22px);
  padding-left: 12px;
  border-left: 3px solid var(--lime);
  color: var(--muted);
  font-size: clamp(11px, 1.2vw, 14px);
  line-height: 1.6;
  letter-spacing: .08em;
}

.message strong { color: var(--white); }

/* HUD CAROUSEL - NO MIN-WIDTH RESTRICTION */
.carousel-wrapper {
  position: relative;
  z-index: 2;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  padding: 12px;
  background: rgba(16, 20, 17, 0.5);
  border: 1px solid rgba(213, 255, 53, 0.15);
  border-radius: 14px;
  backdrop-filter: blur(12px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(213, 255, 53, 0.03);
}

.carousel-wrapper::before,
.carousel-wrapper::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border: 2px solid var(--lime);
  pointer-events: none;
  z-index: 5;
}
.carousel-wrapper::before {
  top: -1px;
  left: -1px;
  border-right: none;
  border-bottom: none;
  border-top-left-radius: 14px;
}
.carousel-wrapper::after {
  bottom: -1px;
  right: -1px;
  border-left: none;
  border-top: none;
  border-bottom-right-radius: 14px;
}

.hud-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 2px 4px 8px;
  font: 9px 'DM Mono', monospace;
  letter-spacing: .1em;
  color: var(--muted);
  border-bottom: 1px dashed rgba(213, 255, 53, 0.15);
  margin-bottom: 8px;
  min-width: 0;
}

.hud-title {
  color: var(--lime);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

#recordCount {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: right;
}

.carousel-container {
  position: relative;
  width: 100%;
  min-width: 0;
  overflow: hidden;
  border-radius: 8px;
  min-height: 200px;
  display: flex;
  align-items: center;
  mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
}

.carousel-track {
  display: flex;
  gap: 12px;
  width: max-content;
  animation: continuousSlide 40s linear infinite;
  will-change: transform;
}

.carousel-wrapper:hover .carousel-track {
  animation-play-state: paused;
}

.carousel-card {
  flex: 0 0 auto;
  width: 180px;
  height: 250px;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  border: 1px solid rgba(213, 255, 53, 0.2);
  background: #151b15;
}

.carousel-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.card-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 3;
  padding: 3px 6px;
  background: rgba(16, 20, 17, 0.85);
  border: 1px solid rgba(213, 255, 53, 0.4);
  border-radius: 4px;
  font: 8px 'DM Mono', monospace;
  color: var(--lime);
}

.card-scanline {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.25) 51%);
  background-size: 100% 4px;
  opacity: 0.4;
  z-index: 2;
}

.carousel-slider-bar {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed rgba(213, 255, 53, 0.15);
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  width: 100%;
}

.slider-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font: 8.5px 'DM Mono', monospace;
  letter-spacing: .08em;
  color: var(--muted);
  min-width: 0;
}

.slider-indicator {
  color: var(--lime);
  font-weight: 700;
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  width: 100%;
}

.image-slider {
  flex: 1;
  min-width: 0;
  -webkit-appearance: none;
  appearance: none;
  height: 5px;
  background: rgba(213, 255, 53, 0.15);
  border-radius: 3px;
  outline: none;
  border: 1px solid rgba(213, 255, 53, 0.25);
}

.image-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 4px;
  background: var(--lime);
  border: 2px solid #101411;
}

.btn-slider-auto {
  background: rgba(16, 20, 17, 0.9);
  border: 1px solid rgba(213, 255, 53, 0.35);
  color: var(--lime);
  font: 700 8.5px 'DM Mono', monospace;
  padding: 5px 8px;
  border-radius: 4px;
  cursor: pointer;
  flex-shrink: 0;
}

footer {
  font: 8.5px 'DM Mono', monospace;
  letter-spacing: .08em;
  color: var(--muted);
  padding-top: 12px;
  flex-wrap: wrap;
}

.toolbar {
  position: fixed;
  bottom: max(12px, env(safe-area-inset-bottom, 12px));
  right: max(12px, env(safe-area-inset-right, 12px));
  z-index: 10;
}

.btn-hud {
  background: rgba(16, 20, 17, 0.9);
  border: 1px solid rgba(213, 255, 53, 0.35);
  color: var(--lime);
  font: 10px 'DM Mono', monospace;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  backdrop-filter: blur(6px);
}

@keyframes continuousSlide {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

@keyframes pulse-danger {
  0% { transform: scale(0.9); opacity: 0.7; }
  100% { transform: scale(1.2); opacity: 1; }
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Tablet & Mobile Breakpoints */
@media (max-width: 860px) {
  main {
    grid-template-columns: minmax(0, 1fr);
    gap: 22px;
    padding: 14px 0 28px;
  }
  .carousel-wrapper {
    max-width: 100%;
  }
  .carousel-card {
    width: 150px;
    height: 210px;
  }
  .carousel-container {
    min-height: 220px;
  }
}

@media (max-width: 480px) {
  .screen {
    padding: 12px 12px 50px;
  }
  .status {
    font-size: 7.5px;
    letter-spacing: .03em;
  }
  h1 {
    font-size: clamp(42px, 13vw, 64px);
    line-height: 0.88;
  }
  .timer-container {
    width: 100%;
    padding: 10px 14px;
  }
  .timer-value {
    font-size: clamp(34px, 11vw, 50px);
  }
  .carousel-card {
    width: 120px;
    height: 170px;
  }
  .carousel-container {
    min-height: 180px;
  }
}
</style>
</head>
<body>
<div class="screen">
  <div class="grid"></div>
  <div class="glow"></div>

  <header>
    <div class="brand">
      <img src="Undaunted-Logo.PNG" alt="Undaunted" class="brand-logo" onerror="this.style.display='none'; document.getElementById('brandText').style.display='block';">
      <span class="brand-text" id="brandText">UNDAUNTED</span>
    </div>
    <div class="status" id="statusHeader"><span class="dot" id="statusDot"></span> BREAK MODE ENABLED</div>
  </header>

  <main>
    <section class="copy">
      <p class="eyebrow">/// TEMPORARILY RECHARGING</p>
      <h1><span>ON</span><span class="lime">BREAK<span style="display:inline;color:white">.</span></span></h1>
      
      <div class="timer-container" id="timerBox">
        <div class="timer-label" id="timerLabel">BREAK REMAINING</div>
        <div class="timer-value" id="timerDisplay">15:00</div>
      </div>

      <div class="message">
        <strong>HUMANS ON BREAK.</strong><br>
        ROBOTS ON DUTY.
      </div>
    </section>

    <!-- HUD MARQUEE CAROUSEL -->
    <div class="carousel-wrapper">
      <div class="hud-header">
        <span class="hud-title"><span class="dot" style="width:5px;height:5px"></span> LIVE OPERATOR FEED</span>
        <span id="recordCount">SYS_LOG // SCANNING IMAGES...</span>
      </div>

      <section class="carousel-container">
        <div class="carousel-track" id="carouselTrack"></div>
      </section>

      <div class="carousel-slider-bar">
        <div class="slider-meta">
          <span>TARGET NAV // <span class="slider-indicator" id="sliderIndicator">FRAME 01</span></span>
          <span id="scrollModeStatus">AUTO-FEED ACTIVE</span>
        </div>
        <div class="slider-row">
          <input type="range" class="image-slider" id="imageSlider" min="0" max="0" value="0" step="1" title="Slide to browse images">
          <button type="button" class="btn-slider-auto" id="resumeAutoBtn" title="Resume continuous auto-scroll">▶ RESUME</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span class="active">● SYSTEM READY</span>
    <span id="footerStatus">OPERATOR ON BREAK</span>
    <span>UNDAUNTED / 01</span>
  </footer>
</div>

<div class="toolbar">
  <button id="fullscreen" class="btn-hud" aria-label="Toggle Fullscreen">⛶ Fullscreen</button>
</div>

<script>
// --- Fullscreen ---
document.getElementById('fullscreen').addEventListener('click', async function () {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
      document.body.classList.add('fullscreen');
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.warn('Fullscreen request rejected or not supported.');
  }
});

document.addEventListener('fullscreenchange', function () {
  document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
});

// --- Break Timer (15 Minutes) ---
const BREAK_DURATION_SECONDS = 15 * 60;
const startTime = Date.now();

const timerBox = document.getElementById('timerBox');
const timerLabel = document.getElementById('timerLabel');
const timerDisplay = document.getElementById('timerDisplay');
const statusDot = document.getElementById('statusDot');
const statusHeader = document.getElementById('statusHeader');
const footerStatus = document.getElementById('footerStatus');

function formatTime(totalSeconds) {
  const mins = Math.floor(totalSeconds / 60);
  const secs = totalSeconds % 60;
  return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const remaining = BREAK_DURATION_SECONDS - elapsed;

  if (remaining >= 0) {
    timerDisplay.textContent = formatTime(remaining);
  } else {
    const overtime = Math.abs(remaining);
    timerDisplay.textContent = `+${formatTime(overtime)}`;
    
    if (!timerBox.classList.contains('overtime-active')) {
      timerBox.classList.add('overtime-active');
      timerLabel.textContent = '⚠ OVERTIME ELAPSED';
      statusDot.classList.add('overtime-dot');
      statusHeader.innerHTML = '<span class="dot overtime-dot" id="statusDot"></span> OVERTIME ALERT';
      footerStatus.textContent = 'OVERTIME IN PROGRESS';
      footerStatus.style.color = 'var(--red)';
    }
  }
}
updateTimer();
setInterval(updateTimer, 1000);

// --- Image Scanner & Marquee ---
const MAX_SEARCH_COUNT = 100;
const EXTENSIONS = ['jpeg', 'jpg', 'png', 'webp'];

function checkImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(src);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

const track = document.getElementById('carouselTrack');
const slider = document.getElementById('imageSlider');
const sliderIndicator = document.getElementById('sliderIndicator');
const scrollModeStatus = document.getElementById('scrollModeStatus');
const resumeAutoBtn = document.getElementById('resumeAutoBtn');

let uniqueImagesCount = 0;
let isManualScrub = false;
let autoSyncInterval = null;

async function loadPermanentFolderImages() {
  const recordCountEl = document.getElementById('recordCount');
  const validImages = [];

  const checkSlot = async (num) => {
    for (const ext of EXTENSIONS) {
      const path = `Images/${num}.${ext}`;
      const found = await checkImage(path);
      if (found) return { num, path: found };
    }
    return null;
  };

  const tasks = [];
  for (let i = 1; i <= MAX_SEARCH_COUNT; i++) {
    tasks.push(checkSlot(i));
  }

  const results = await Promise.all(tasks);
  results.filter(Boolean).sort((a, b) => a.num - b.num).forEach(item => validImages.push(item.path));

  if (validImages.length === 0) {
    recordCountEl.textContent = 'SYS_LOG // 0 RECORDS (EMPTY FOLDER)';
    slider.disabled = true;
    return;
  }

  uniqueImagesCount = validImages.length;
  recordCountEl.textContent = `SYS_LOG // ${uniqueImagesCount} RECORDS`;

  slider.max = Math.max(0, uniqueImagesCount - 1);
  slider.value = 0;

  function createCard(src, index) {
    const badgeNumber = String(index + 1).padStart(2, '0');
    const card = document.createElement('div');
    card.className = 'carousel-card';
    card.innerHTML = `
      <span class="card-badge">CAM // ${badgeNumber}</span>
      <div class="card-scanline"></div>
      <img src="${src}" alt="CAM ${badgeNumber}">
    `;
    return card;
  }

  validImages.forEach((src, idx) => track.appendChild(createCard(src, idx)));
  validImages.forEach((src, idx) => track.appendChild(createCard(src, idx)));

  const totalCards = validImages.length * 2;
  const animDuration = Math.max(25, totalCards * 1.5);
  track.style.animationDuration = `${animDuration}s`;

  startAutoSync();
}

function startAutoSync() {
  if (autoSyncInterval) clearInterval(autoSyncInterval);
  autoSyncInterval = setInterval(() => {
    if (isManualScrub || uniqueImagesCount <= 1) return;
    const computedMatrix = window.getComputedStyle(track).transform;
    if (computedMatrix && computedMatrix !== 'none') {
      const match = computedMatrix.match(/matrix.*\((.+)\)/);
      if (match) {
        const values = match[1].split(', ');
        const currentX = Math.abs(parseFloat(values[4]));
        const halfWidth = track.scrollWidth / 2;
        if (halfWidth > 0) {
          const ratio = (currentX % halfWidth) / halfWidth;
          const currIdx = Math.min(uniqueImagesCount - 1, Math.floor(ratio * uniqueImagesCount));
          slider.value = currIdx;
          sliderIndicator.textContent = `FRAME ${String(currIdx + 1).padStart(2, '0')}`;
        }
      }
    }
  }, 350);
}

function getCardStepDistance() {
  const firstCard = track.querySelector('.carousel-card');
  if (firstCard) {
    const gap = parseFloat(window.getComputedStyle(track).gap) || 12;
    return firstCard.offsetWidth + gap;
  }
  return 160;
}

function applySliderScroll(idx) {
  isManualScrub = true;
  track.style.animation = 'none';
  track.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
  
  const step = getCardStepDistance();
  const offset = -(idx * step);
  track.style.transform = `translateX(${offset}px)`;
  
  sliderIndicator.textContent = `FRAME ${String(idx + 1).padStart(2, '0')}`;
  scrollModeStatus.textContent = 'MANUAL TARGET LOCKED';
  scrollModeStatus.style.color = 'var(--lime)';
}

slider.addEventListener('input', function () {
  applySliderScroll(parseInt(this.value, 10));
});

resumeAutoBtn.addEventListener('click', function () {
  isManualScrub = false;
  track.style.transition = 'none';
  track.style.transform = 'none';
  track.style.animation = '';
  scrollModeStatus.textContent = 'AUTO-FEED ACTIVE';
  scrollModeStatus.style.color = 'var(--muted)';
  startAutoSync();
});

loadPermanentFolderImages();
</script>
</body>
</html>
